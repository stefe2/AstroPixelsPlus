[platformio]
default_envs = astropixelsplus

[common]

[env:astropixelsplus]
platform = https://github.com/platformio/platform-espressif32.git#v5.2.0
board = esp32dev
framework = arduino
lib_archive = true
;override if you need a specific port
;upload_port = /dev/ttyUSB0
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = 
	default
	esp32_exception_decoder
; Reeltwo 23.5.3 est intégré dans lib/Reeltwo avec les modifications locales (voir lib/Reeltwo/LOCAL-CHANGES.md)
lib_deps =
    https://github.com/adafruit/Adafruit_NeoPixel#1.15.2
    fastled/FastLED@3.7.0
    https://github.com/DFRobot/DFRobotDFPlayerMini#V1.0.6
build_type = release
build_flags = 
	-DCORE_DEBUG_LEVEL=3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Os

