<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Le Maestro sur Serial1 pilote les 19 servos du dôme" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="480" fill="#ffffff"/>
  <defs>
    <marker id="wiring-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a8f"/>
    </marker>
  </defs>
  <text x="24" y="36" font-size="15" font-weight="600" fill="#1f1f1f">Le Maestro sur Serial1 pilote les 19 servos du dôme</text>
  <text x="24" y="58" font-size="11.5" fill="#6b6b6b">Traits pleins : signaux et logique · pointillés : alimentations de puissance</text>

  <g fill="none" stroke="#9a9a8f" stroke-width="1.25">
    <path d="M224 124H264" marker-end="url(#wiring-arrow)"/>
    <path d="M496 140H536" marker-end="url(#wiring-arrow)"/>
    <path d="M380 268V304" marker-end="url(#wiring-arrow)"/>
    <path d="M636 336V368" marker-end="url(#wiring-arrow)"/>
  </g>
  <g fill="none" stroke="#9a9a8f" stroke-width="1.25" stroke-dasharray="5 4">
    <path d="M224 330H244V200H264" marker-end="url(#wiring-arrow)"/>
    <path d="M496 428H536" marker-end="url(#wiring-arrow)"/>
  </g>

  <!-- Contrôleur maître -->
  <rect x="24" y="80" width="200" height="72" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
  <text x="40" y="104" font-weight="600" fill="#1f1f1f">Contrôleur maître</text>
  <text x="40" y="122" font-size="11.5" fill="#6b6b6b">Marcduino ou Kyber</text>
  <text x="40" y="138" font-size="11.5" fill="#6b6b6b">fil 1 → RX16, 9600 bauds</text>

  <!-- Carte AstroPixels -->
  <rect x="264" y="80" width="232" height="188" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
  <text x="280" y="104" font-weight="600" fill="#1f1f1f">Carte AstroPixels (ESP32)</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="280" y="128">RX16 ← Serial2 (commandes)</text>
    <text x="280" y="144">AUX5 : TX19, 5 V, GND → Maestro</text>
    <text x="280" y="160" fill="#6b6b6b">RX18 : non branché</text>
    <text x="280" y="176">GPIO15 FLD · GPIO33 RLD</text>
    <text x="280" y="192">GPIO32 FPSI · GPIO23 RPSI</text>
    <text x="280" y="208">GPIO25 FHP · 26 RHP · 27 THP</text>
    <text x="280" y="224">GPIO2 LED heartbeat</text>
    <text x="280" y="240" fill="#6b6b6b">SDA21, SCL22 : libres</text>
  </g>

  <!-- Maestro -->
  <rect x="536" y="80" width="200" height="256" rx="8" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/>
  <text x="552" y="104" font-weight="600" fill="#1f1f1f">Pololu Maestro 24</text>
  <g font-size="11.5" fill="#1f1f1f">
    <text x="552" y="128">n° 1 · 115200 bauds · fil 2</text>
    <text x="552" y="144">0 porte 4 · 1 porte 3</text>
    <text x="552" y="160">2 porte 2 · 3 porte 1</text>
    <text x="552" y="176">4 porte 5 · 5 porte 9</text>
    <text x="552" y="192">6 à 9 pie panels 1 à 4</text>
    <text x="552" y="208">10 mini porte 2</text>
    <text x="552" y="224">11 mini porte PSI avant</text>
    <text x="552" y="240">12 panneau du sommet</text>
    <text x="552" y="256">13, 14 holo avant H, V</text>
    <text x="552" y="272">15, 16 holo haut H, V</text>
    <text x="552" y="288">17, 18 holo arrière V, H</text>
    <text x="552" y="304" fill="#6b6b6b">19 à 23 libres</text>
    <text x="552" y="320" fill="#6b6b6b">sans cavalier VSRV=VIN</text>
  </g>

  <!-- Sorties LED -->
  <rect x="264" y="304" width="232" height="72" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
  <text x="280" y="328" font-weight="600" fill="#1f1f1f">Sorties LED WS2812</text>
  <text x="280" y="346" font-size="11.5" fill="#6b6b6b">FLD, RLD, PSI avant et arrière</text>
  <text x="280" y="362" font-size="11.5" fill="#6b6b6b">LED des 3 holos, signal 3,3 V</text>

  <!-- Servos -->
  <rect x="536" y="368" width="200" height="88" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
  <text x="552" y="392" font-weight="600" fill="#1f1f1f">Servos</text>
  <text x="552" y="410" font-size="11.5" fill="#6b6b6b">13 panneaux (canaux 0 à 12)</text>
  <text x="552" y="426" font-size="11.5" fill="#6b6b6b">6 holo (canaux 13 à 18)</text>
  <text x="552" y="442" font-size="11.5" fill="#6b6b6b">alimentés par VSRV</text>

  <!-- Alimentation servos -->
  <rect x="264" y="400" width="232" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="280" y="424" font-weight="600" fill="#1f1f1f">Alimentation servos 6 V</text>
  <text x="280" y="442" font-size="11.5" fill="#6b6b6b">externe → borne VSRV du Maestro</text>

  <!-- Alimentation carte -->
  <rect x="24" y="304" width="200" height="88" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="40" y="328" font-weight="600" fill="#1f1f1f">Alimentation carte 5 V</text>
  <text x="40" y="346" font-size="11.5" fill="#6b6b6b">24 V : fils 3 et 4</text>
  <text x="40" y="362" font-size="11.5" fill="#6b6b6b">GND : fils 5 et 6</text>
  <text x="40" y="378" font-size="11.5" fill="#6b6b6b">buck 24 V → 5 V (requis)</text>
</svg>
