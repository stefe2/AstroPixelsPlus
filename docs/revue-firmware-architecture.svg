<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Une seule boucle relie les commandes aux servos et aux LED" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a8f"/>
    </marker>
  </defs>
  <text x="24" y="36" font-size="15" font-weight="600" fill="#1f1f1f">Une seule boucle relie les commandes aux servos et aux LED</text>
  <g fill="none" stroke="#9a9a8f" stroke-width="1.25">
    <path d="M224 92H280" marker-end="url(#arch-arrow)"/>
    <path d="M480 92H536" marker-end="url(#arch-arrow)"/>
    <path d="M636 120V176" marker-end="url(#arch-arrow)"/>
    <path d="M586 120V148H380V176" marker-end="url(#arch-arrow)"/>
    <path d="M380 232V288" marker-end="url(#arch-arrow)"/>
    <path d="M636 232V288" marker-end="url(#arch-arrow)"/>
    <path d="M380 344V400" marker-end="url(#arch-arrow)"/>
    <path d="M636 344V400" marker-end="url(#arch-arrow)"/>
    <path d="M536 316H480" marker-end="url(#arch-arrow)"/>
  </g>
  <g text-anchor="middle">
    <rect x="24" y="64" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="124" y="88" font-weight="600" fill="#1f1f1f">Sources série</text>
    <text x="124" y="106" font-size="11.5" fill="#6b6b6b">USB 115200 · Serial2 9600</text>

    <rect x="280" y="64" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="380" y="88" font-weight="600" fill="#1f1f1f">Parseur mainLoop()</text>
    <text x="380" y="106" font-size="11.5" fill="#6b6b6b">1 caractère par tour</text>

    <rect x="536" y="64" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="636" y="88" font-weight="600" fill="#1f1f1f">AnimationPlayer</text>
    <text x="636" y="106" font-size="11.5" fill="#6b6b6b">1 seule animation active</text>

    <rect x="280" y="176" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="380" y="200" font-weight="600" fill="#1f1f1f">ServoSequencer</text>
    <text x="380" y="218" font-size="11.5" fill="#6b6b6b">étapes + fermeture auto</text>

    <rect x="536" y="176" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="636" y="200" font-weight="600" fill="#1f1f1f">CommandEvent</text>
    <text x="636" y="218" font-size="11.5" fill="#6b6b6b">LE… logics, HP… holos</text>

    <rect x="280" y="288" width="200" height="56" rx="8" fill="#2f6fd0" fill-opacity="0.12" stroke="#2f6fd0" stroke-width="2"/>
    <text x="380" y="312" font-weight="600" fill="#1f1f1f">ServoDispatchMaestro</text>
    <text x="380" y="330" font-size="11.5" fill="#1f1f1f">interpolation, trames 6 o</text>

    <rect x="536" y="288" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="636" y="312" font-weight="600" fill="#1f1f1f">Logics, PSI, Holos</text>
    <text x="636" y="330" font-size="11.5" fill="#6b6b6b">AnimatedEvent::process()</text>

    <rect x="280" y="400" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="380" y="424" font-weight="600" fill="#1f1f1f">Pololu Maestro</text>
    <text x="380" y="442" font-size="11.5" fill="#6b6b6b">UART1 115200, 24 servos</text>

    <rect x="536" y="400" width="200" height="56" rx="8" fill="none" stroke="#9a9a8f" stroke-width="1.25"/>
    <text x="636" y="424" font-weight="600" fill="#1f1f1f">LED WS2812</text>
    <text x="636" y="442" font-size="11.5" fill="#6b6b6b">NeoPixel via RMT, bloquant</text>
